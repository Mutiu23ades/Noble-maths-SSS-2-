name: Build SSS 2 Mathematics APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@7.4.3 @capacitor/cli@7.4.3 @capacitor/android@7.4.3

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Force Kotlin dependency compatibility
        working-directory: android
        run: |
          echo "configurations.all {"
          echo "    resolutionStrategy.eachDependency { details ->"
          echo "        if (details.requested.group == 'org.jetbrains.kotlin') {"
          echo "            details.useVersion '1.8.22'"
          echo "        }"
          echo "    }"
          echo "}" >> app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-2-Mathematics-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
